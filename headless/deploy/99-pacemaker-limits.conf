# Real-time limits for interactive runs (pacemaker_headless started from a shell, aplay, jackd ...).
# The systemd service gets the same through LimitRTPRIO / LimitMEMLOCK in pacemaker.service.
# Install to /etc/security/limits.d/99-pacemaker.conf; users must be in the 'audio' group (log in again afterwards).
@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice       -19
pacemaker -  rtprio    95
pacemaker -  memlock   unlimited
